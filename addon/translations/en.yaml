configuration:
  apex_host:
    name: Apex host
    description: >-
      Controller base URL on your LAN, e.g. http://192.168.1.50 or
      http://apex.local
  apex_username:
    name: Apex username
    description: The login you use on the controller's own web page (usually admin).
  apex_password:
    name: Apex password
    description: Password for that login.
  poll_seconds:
    name: Poll interval (seconds)
    description: How often to read the controller. 15 is a good value; the minimum is 5.
  log_level:
    name: Log level
    description: Use DEBUG only while troubleshooting.
