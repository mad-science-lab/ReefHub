[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reefhub"
version = "0.1.0"
description = "Neptune Apex to MQTT bridge: read everything, control outlets and feed modes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "aiohttp>=3.9",
    "aiomqtt>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
reefhub = "reefhub.__main__:main"

[tool.setuptools.packages.find]
include = ["reefhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
